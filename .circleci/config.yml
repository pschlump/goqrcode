version: 2.1

jobs:
  build:
    working_directory: ~/repo
    docker:
      - image: cimg/go:1.24
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v5-{{ checksum "go.sum" }}
      - run:
          name: Install Dependencies
          command: go mod download
      - save_cache:
          key: go-mod-v5-{{ checksum "go.sum" }}
          paths:
            - "/home/circleci/go/pkg/mod"
      - run:
          name: Vet
          command: go vet ./...
      - run:
          name: Run tests
          command: go test ./...

workflows:
  build:
    jobs:
      - build
